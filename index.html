<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LicitaPro · MSMS CORP</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#18181b" />

  <!-- Apple PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LicitaPro" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    if (window.pdfjsLib)
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  </script>

  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ─────────────────────────────────────── */
    :root {
      /* Backgrounds */
      --bg1: #ffffff;
      --bg2: #f7f7f5;
      --bg3: #f0ede8;
      --bg4: #e8e4de;

      /* Borders */
      --b1: #e8e4de;
      --b2: #dedad4;
      --b3: #d0ccc5;

      /* Text */
      --t1: #18181b;
      --t2: #71717a;
      --t3: #a1a1aa;

      /* Brand colors */
      --blue:  #2563eb;
      --blue-bg: #eff6ff;
      --blue-border: #bfdbfe;

      --green:  #16a34a;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;

      --amber:  #d97706;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;

      --red:    #dc2626;
      --red-bg: #fef2f2;
      --red-border: #fecaca;

      --purple: #7c3aed;
      --purple-bg: #f5f3ff;
      --purple-border: #ddd6fe;

      /* Accent (primary action) */
      --accent: #18181b;
      --accent-hover: #3f3f46;

      /* Layout */
      --sidebar-w: 220px;
      --r: 8px;
      --rl: 12px;

      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);

      /* Type scale */
      --text-xs:   11px;
      --text-sm:   12px;
      --text-base: 13px;
      --text-md:   14px;
      --text-lg:   16px;
      --text-xl:   20px;
      --text-2xl:  24px;
    }

    /* ── Base ──────────────────────────────────────────────── */
    html { height: 100%; background: var(--bg3); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      color: var(--t1);
      font-size: var(--text-base);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      background: var(--bg3);
      height: 100%;
    }

    /* ── Forms ─────────────────────────────────────────────── */
    input, select, textarea {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--b2);
      border-radius: var(--r);
      font-size: var(--text-base);
      font-family: inherit;
      color: var(--t1);
      background: var(--bg1);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      appearance: auto;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    input[type="checkbox"], input[type="radio"] {
      width: auto;
      accent-color: var(--accent);
    }
    input[type="range"] { padding: 0; border: none; background: transparent; box-shadow: none; }
    input:read-only { background: var(--bg2); color: var(--t2); }
    textarea { resize: vertical; min-height: 72px; }

    /* ── Buttons ───────────────────────────────────────────── */
    button {
      padding: 7px 14px;
      border: 1px solid var(--b2);
      border-radius: var(--r);
      font-size: var(--text-base);
      font-family: inherit;
      cursor: pointer;
      color: var(--t1);
      background: var(--bg1);
      transition: background .1s, border-color .1s, opacity .1s;
      font-weight: 400;
      line-height: 1.4;
    }
    button:hover:not(:disabled) { background: var(--bg2); border-color: var(--b3); }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    /* Primary button */
    button.bp {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 500;
    }
    button.bp:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

    /* Tab button */
    button.tab {
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 9px 14px;
      font-size: var(--text-base);
      color: var(--t2);
      background: transparent;
      font-weight: 400;
    }
    button.tab:hover { color: var(--t1); background: transparent; }
    button.tab.active { color: var(--t1); border-bottom-color: var(--t1); font-weight: 500; }

    /* ── Cards ─────────────────────────────────────────────── */
    .card {
      background: var(--bg1);
      border: 1px solid var(--b1);
      border-radius: var(--rl);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
    }
    /* Tabla con scroll horizontal que llega hasta el borde de la card (desktop padding 22px) */
    .tbl-scroll { overflow-x: auto; margin-left: -22px; margin-right: -22px; padding-left: 22px; padding-right: 22px; -webkit-overflow-scrolling: touch; }
    .metric {
      background: var(--bg1);
      border: 1px solid var(--b1);
      border-radius: var(--rl);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }

    /* ── Tables ────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; }
    table td { vertical-align: middle; }
    tbody tr:hover td { background: var(--bg2); }
    tbody tr:nth-child(even) td { background: var(--bg2); }
    tbody tr:nth-child(even):hover td { background: var(--bg3); }

    /* ── Utilities ─────────────────────────────────────────── */
    .empty { text-align: center; padding: 60px 20px; color: var(--t2); }
    .empty h3 { font-size: var(--text-xl); font-weight: 500; margin-bottom: 8px; color: var(--t1); }
    .alert-r { background: var(--red-bg); color: #7f1d1d; border: 1px solid var(--red-border); }
    .alert-y { background: var(--amber-bg); color: #78350f; border: 1px solid var(--amber-border); }
    .drop {
      border: 1.5px dashed var(--b2);
      border-radius: var(--r);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-bg); }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 4px; }

    /* ── Section header ────────────────────────────────────── */
    .page-title {
      font-size: var(--text-xl);
      font-weight: 600;
      color: var(--t1);
      letter-spacing: -0.3px;
    }

    /* ── Sidebar ───────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg1);
      border-right: 1px solid var(--b1);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--b1);
    }
    .sidebar-brand {
      font-size: var(--text-xs);
      letter-spacing: 1.5px;
      color: var(--t3);
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .sidebar-name {
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--t1);
      letter-spacing: -0.3px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      color: var(--t2);
      font-weight: 400;
      border-radius: var(--r);
      margin-bottom: 1px;
      font-size: var(--text-base);
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background .1s, color .1s;
    }
    .nav-item:hover { background: var(--bg2); color: var(--t1); border-color: transparent; }
    .nav-item.active {
      background: var(--bg2);
      color: var(--t1);
      font-weight: 500;
      border-color: transparent;
    }
    .nav-icon { font-size: 15px; opacity: .7; flex-shrink: 0; }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--b1);
    }
    .sidebar-email {
      font-size: var(--text-xs);
      color: var(--t3);
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Main content ──────────────────────────────────────── */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-w);
      padding: 28px 28px;
      max-width: calc(100vw - var(--sidebar-w));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Badge ─────────────────────────────────────────────── */
    .badge-pill {
      display: inline-block;
      font-size: var(--text-xs);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Mobile nav ────────────────────────────────────────── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg1);
      border-top: 1px solid var(--b1);
      z-index: 200;
      padding-top: 6px;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    .mobile-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--t3);
      font-size: 10px;
      cursor: pointer;
      border-radius: var(--r);
      transition: color .1s;
    }
    .mobile-nav-btn.active { color: var(--t1); }
    .mobile-nav-btn .nav-dot { font-size: 20px; line-height: 1; }

    /* ── Mobile hamburger ──────────────────────────────────── */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(52px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: var(--bg1);
      border-bottom: 1px solid var(--b1);
      z-index: 150;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
    }
    .mobile-header-title {
      font-size: var(--text-md);
      font-weight: 600;
    }
    .mobile-drawer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
    }
    .mobile-drawer-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.4);
    }
    .mobile-drawer-panel {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 260px;
      background: var(--bg1);
      padding: 20px 12px;
      overflow-y: auto;
    }
    .mobile-drawer.open { display: block; }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Estructura */
      .sidebar { display: none; }
      .mobile-header { display: flex; }
      .mobile-nav { display: block; }
      .main-content {
        margin-left: 0;
        max-width: 100vw;
        width: 100vw;
        overflow-x: hidden;
        padding-top: calc(64px + env(safe-area-inset-top));
        padding-left: 14px;
        padding-right: 14px;
        padding-bottom: calc(60px + env(safe-area-inset-bottom));
      }
      /* Red de seguridad: la PÁGINA no se desborda, pero el contenido interno de las tarjetas sí puede hacer scroll-x */
      html, body { overflow-x: hidden; max-width: 100vw; }
      /* Relleno del área detrás de la barra inferior (safe-area / barra de gestos) con el color de la barra */
      body::after {
        content: '';
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: env(safe-area-inset-bottom);
        background: var(--bg1);
        z-index: 199;
        pointer-events: none;
      }
      .card { max-width: 100%; }
      .tbl-scroll { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
      /* KPIs en tira deslizable */
      .kpi-strip { display: flex !important; overflow-x: auto; gap: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .kpi-strip::-webkit-scrollbar { display: none; }
      .kpi-strip > * { flex: 0 0 auto; min-width: 120px; }

      /* Grids: métricas en 2 columnas, el resto en 1 */
      .grid-5, .grid-4 { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
      .grid-3, .grid-2 { grid-template-columns: 1fr !important; gap: 12px !important; }

      /* Tipografía y títulos */
      .page-title { font-size: 18px; }
      .hide-mobile { display: none !important; }

      /* Cards y métricas compactas */
      .card   { padding: 16px !important; border-radius: var(--rl) !important; }
      .metric { padding: 13px 14px !important; border-radius: var(--rl) !important; }

      /* Tabs */
      .tab-scroll::-webkit-scrollbar { display: none; }
      button.tab { padding: 8px 11px; font-size: 12px; }

      /* Botón nuevo del dashboard oculto (ya hay + en el header) */
      .dash-new-btn { display: none !important; }

      /* Tablas compactas con scroll horizontal */
      table { font-size: 12px !important; }
      table td, table th { padding: 8px 6px !important; white-space: nowrap; }

      /* Alertas en columna */
      .alert-row { flex-direction: column !important; align-items: flex-start !important; gap: 4px !important; }
      .alert-badge { align-self: flex-start !important; }

      /* Grids inline sin clase — forzar 1 columna en mobile */
      .mob-1col  { grid-template-columns: 1fr !important; }
      .mob-2col  { grid-template-columns: repeat(2, 1fr) !important; }
      .show-mobile { display: flex !important; flex-direction: column; }

      /* Filtros apilados verticalmente para que quepan completos */
      .filtros-bar { flex-direction: column !important; }
      .filtros-bar > * { width: 100% !important; max-width: 100% !important; box-sizing: border-box; }
      .filtros-bar select, .filtros-bar input { width: 100% !important; max-width: 100% !important; box-sizing: border-box; }
      .filtros-bar .filtro-spacer { display: none !important; }
      .filtros-bar .view-toggle { display: flex; gap: 8px; }
      .filtros-bar .view-toggle button { flex: 1; }

      /* Botones un poco más altos para tocar mejor */
      button { padding: 9px 14px; }
      button.tab { padding: 8px 11px; }

      /* Inputs más cómodos al tocar */
      input, select, textarea { padding: 10px 12px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
