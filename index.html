<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LicitaPro · MSMS CORP</title>

  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
    }
  }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib)
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg1:#ffffff; --bg2:#f6f6f4; --bg3:#f0ede8;
      --b2:#e0ddd8; --b3:#ede9e3;
      --t1:#1a1917; --t2:#6b6862; --t3:#a0998f;
      --blue:#3b6cf4; --green:#1D9E75; --amber:#d97706; --red:#e24b4a;
      --r:6px; --rl:12px;
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--t1); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    input,select,textarea { width:100%; padding:7px 10px; border:.5px solid var(--b2); border-radius:var(--r); font-size:13px; font-family:inherit; color:var(--t1); background:var(--bg1); outline:none; transition:border-color .15s; }
    input:focus,select:focus,textarea:focus { border-color:var(--blue); }
    input[type="checkbox"],input[type="radio"] { width:auto; }
    input[type="range"] { padding:0; border:none; background:transparent; }
    input:read-only { background:var(--bg2); color:var(--t2); }
    textarea { resize:vertical; min-height:70px; }
    button { padding:7px 14px; border:.5px solid var(--b2); border-radius:var(--r); font-size:13px; font-family:inherit; cursor:pointer; color:var(--t1); background:var(--bg1); transition:background .1s,opacity .1s; }
    button:hover:not(:disabled) { background:var(--bg2); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    button.bp { background:var(--t1); color:var(--bg1); border-color:var(--t1); font-weight:500; }
    button.bp:hover:not(:disabled) { opacity:.85; }
    button.tab { border:none; border-bottom:2px solid transparent; border-radius:0; padding:8px 14px; font-size:13px; color:var(--t2); background:transparent; }
    button.tab:hover { color:var(--t1); background:transparent; }
    button.tab.active { color:var(--t1); border-bottom-color:var(--t1); font-weight:500; }
    .card { background:var(--bg1); border:.5px solid var(--b2); border-radius:var(--rl); padding:20px 22px; }
    .metric { background:var(--bg1); border:.5px solid var(--b2); border-radius:var(--rl); padding:16px 18px; }
    table { width:100%; border-collapse:collapse; }
    table td { vertical-align:middle; }
    tr:hover td { background:var(--bg2); }
    .empty { text-align:center; padding:60px 20px; color:var(--t2); }
    .empty h3 { font-size:18px; font-weight:500; margin-bottom:8px; color:var(--t1); }
    .alert-r { background:#FCEBEB; color:#791F1F; }
    .alert-y { background:#FAEEDA; color:#633806; }
    .drop { border:1.5px dashed var(--b2); border-radius:var(--r); padding:20px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s; }
    .drop:hover,.drop.over { border-color:var(--blue); background:#3b6cf408; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--b2); border-radius:3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
