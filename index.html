<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>LicitaPro</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#18181b" />

  <!-- Apple PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LicitaPro" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    if (window.pdfjsLib)
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  </script>

  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ─────────────────────────────────────── */
    :root {
      /* Backgrounds */
      --bg1: #ffffff;
      --bg2: #f7f7f5;
      --bg3: #f0ede8;
      --bg4: #e8e4de;

      /* Borders */
      --b1: #e8e4de;
      --b2: #dedad4;
      --b3: #d0ccc5;

      /* Text */
      --t1: #18181b;
      --t2: #71717a;
      --t3: #a1a1aa;

      /* Brand colors */
      --blue:  #2563eb;
      --blue-bg: #eff6ff;
      --blue-border: #bfdbfe;

      --green:  #16a34a;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;

      --amber:  #d97706;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;

      --red:    #dc2626;
      --red-bg: #fef2f2;
      --red-border: #fecaca;

      --purple: #7c3aed;
      --purple-bg: #f5f3ff;
      --purple-border: #ddd6fe;

      /* Accent (primary action) */
      --accent: #18181b;
      --accent-hover: #3f3f46;

      /* Layout */
      --sidebar-w: 220px;
      --r: 8px;
      --rl: 12px;
      /* Fase 3I -- ancho máximo de lectura. Evita que las tablas y el
         texto se estiren indefinidamente en monitores anchos, que era una
         de las causas principales de la sensación de "prototipo". */
      --content-max: 1440px;

      /* Shadows -- Fase 3I: más sutiles y en capas, estilo ERP moderno
         (antes eran algo duras y planas). */
      --shadow-sm: 0 1px 2px rgba(24,24,27,.04), 0 1px 3px rgba(24,24,27,.03);
      --shadow-md: 0 2px 4px rgba(24,24,27,.04), 0 8px 16px -4px rgba(24,24,27,.06);

      /* Type scale */
      --text-xs:   11px;
      --text-sm:   12px;
      --text-base: 13px;
      --text-md:   14px;
      --text-lg:   16px;
      --text-xl:   20px;
      --text-2xl:  24px;
    }

    /* ── Base ──────────────────────────────────────────────── */
    html { height: 100%; background: #ffffff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      color: var(--t1);
      font-size: var(--text-base);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      background: var(--bg3);
      height: 100%;
    }

    /* ── Forms ─────────────────────────────────────────────── */
    input, select, textarea {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--b2);
      border-radius: var(--r);
      font-size: var(--text-base);
      font-family: inherit;
      color: var(--t1);
      background: var(--bg1);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      appearance: auto;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    input[type="checkbox"], input[type="radio"] {
      width: auto;
      accent-color: var(--accent);
    }
    input[type="range"] { padding: 0; border: none; background: transparent; box-shadow: none; }
    /* iOS: input date se renderiza nativo y centra el texto; forzar alineación y altura */
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      text-align: left;
      min-height: 38px;
      line-height: normal;
      display: block;
    }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; }
    input:read-only { background: var(--bg2); color: var(--t2); }
    textarea { resize: vertical; min-height: 72px; }

    /* ── Buttons ───────────────────────────────────────────── */
    button {
      padding: 7px 14px;
      border: 1px solid var(--b2);
      border-radius: var(--r);
      font-size: var(--text-base);
      font-family: inherit;
      cursor: pointer;
      color: var(--t1);
      background: var(--bg1);
      transition: background .1s, border-color .1s, opacity .1s;
      font-weight: 400;
      line-height: 1.4;
    }
    button:hover:not(:disabled) { background: var(--bg2); border-color: var(--b3); }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    /* Primary button */
    button.bp {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 500;
    }
    button.bp:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

    /* Tab button */
    /* Fase 3I -- transición suave y estado activo más definido. */
    button.tab {
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      padding: 10px 15px;
      font-size: var(--text-base);
      color: var(--t2);
      background: transparent;
      font-weight: 400;
      transition: color .12s, border-color .12s;
    }
    button.tab:hover { color: var(--t1); background: transparent; border-bottom-color: var(--b2); }
    button.tab:active:not(:disabled) { transform: none; }
    button.tab.active { color: var(--t1); border-bottom-color: var(--accent); font-weight: 600; }

    /* ── Cards ─────────────────────────────────────────────── */
    /* Fase 3I -- más aire interior y borde/sombra más suaves, para que
       las secciones se lean como bloques separados y no como cajas
       apretadas. */
    .card {
      background: var(--bg1);
      border: 1px solid var(--b1);
      border-radius: var(--rl);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
    }
    /* Tabla con scroll horizontal que llega hasta el borde de la card (desktop padding 24px) */
    .tbl-scroll { overflow-x: auto; margin-left: -24px; margin-right: -24px; padding-left: 24px; padding-right: 24px; -webkit-overflow-scrolling: touch; }
    .metric {
      background: var(--bg1);
      border: 1px solid var(--b1);
      border-radius: var(--rl);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .15s, border-color .15s;
    }
    /* Fase 3I -- feedback sutil al pasar el cursor sobre un KPI/card
       clickeable, sin animaciones llamativas. */
    .metric:hover { box-shadow: var(--shadow-md); border-color: var(--b2); }

    /* ── Tables ────────────────────────────────────────────── */
    /* Fase 3I -- se quitó el zebra striping (nth-child even), que
       saturaba visualmente y competía con los badges de estado. Ahora la
       separación es por línea sutil + hover, patrón estándar de ERP
       moderno. Los encabezados quedan mejor definidos (uppercase
       discreto) y las filas tienen más aire vertical. */
    table { width: 100%; border-collapse: collapse; }
    table th {
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: .5px;
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--b2);
      white-space: nowrap;
    }
    table td { vertical-align: middle; padding: 11px 8px; border-bottom: 1px solid var(--b1); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover td { background: var(--bg2); }

    /* ── Utilities ─────────────────────────────────────────── */
    /* Fase 3I -- estados vacíos con más presencia: fondo suave, borde
       punteado discreto, para que se lean como "aquí no hay nada aún" y
       no como un error o un espacio roto. */
    .empty {
      text-align: center;
      padding: 56px 24px;
      color: var(--t2);
      background: var(--bg2);
      border: 1px dashed var(--b2);
      border-radius: var(--rl);
    }
    .empty h3 { font-size: var(--text-lg); font-weight: 600; margin-bottom: 6px; color: var(--t1); letter-spacing: -.2px; }
    .empty p { font-size: var(--text-base); color: var(--t2); max-width: 420px; margin: 0 auto; }
    .alert-r { background: var(--red-bg); color: #7f1d1d; border: 1px solid var(--red-border); }
    .alert-y { background: var(--amber-bg); color: #78350f; border: 1px solid var(--amber-border); }
    .drop {
      border: 1.5px dashed var(--b2);
      border-radius: var(--r);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-bg); }

    /* ── Scrollbar ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 4px; }

    /* ── Section header ────────────────────────────────────── */
    /* Fase 3I -- el título de página gana peso y aire para anclar la
       jerarquía visual de cada pantalla. */
    .page-title {
      font-size: var(--text-2xl);
      font-weight: 600;
      color: var(--t1);
      letter-spacing: -0.5px;
      line-height: 1.25;
    }
    /* Fase 3I -- encabezado de sección reutilizable dentro de cards
       (patrón que ya se repetía inline en varias vistas). */
    .section-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 10px;
    }

    /* ── Sidebar ───────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg1);
      border-right: 1px solid var(--b1);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--b1);
    }
    .sidebar-brand {
      font-size: var(--text-xs);
      letter-spacing: 1.5px;
      color: var(--t3);
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .sidebar-name {
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--t1);
      letter-spacing: -0.3px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      color: var(--t2);
      font-weight: 400;
      border-radius: var(--r);
      margin-bottom: 1px;
      font-size: var(--text-base);
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background .1s, color .1s;
    }
    .nav-item:hover { background: var(--bg2); color: var(--t1); border-color: transparent; }
    .nav-item.active {
      background: var(--bg2);
      color: var(--t1);
      font-weight: 500;
      border-color: transparent;
    }
    .nav-icon { font-size: 15px; opacity: .7; flex-shrink: 0; width: 18px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--b1);
    }
    .sidebar-email {
      font-size: var(--text-xs);
      color: var(--t3);
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Main content ──────────────────────────────────────── */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-w);
      padding: 32px 32px 48px;
      max-width: calc(100vw - var(--sidebar-w));
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Fase 3I -- el contenido se centra y deja de estirarse
       indefinidamente en monitores anchos (una de las causas principales
       de que la app se sintiera "de prototipo"). */
    .main-content > * { max-width: var(--content-max); margin-left: auto; margin-right: auto; }

    /* ── Badge ─────────────────────────────────────────────── */
    /* Fase 3I -- borde sutil (currentColor translúcido) para que los
       badges de estatus se lean con más definición sobre fondos claros,
       sin subir la saturación de color. */
    .badge-pill {
      display: inline-block;
      font-size: var(--text-xs);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      white-space: nowrap;
      border: 1px solid rgba(24,24,27,.07);
      line-height: 1.5;
    }

    /* ── Mobile nav ────────────────────────────────────────── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg1);
      border-top: 1px solid var(--b1);
      z-index: 200;
      padding-top: 8px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    /* Garantiza que la franja del safe-area bajo la barra sea blanca, no beige */
    .mobile-nav::after {
      content: '';
      position: absolute;
      top: 100%; left: 0; right: 0;
      height: 100px;
      background: var(--bg1);
    }
    .mobile-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--t3);
      font-size: 10px;
      cursor: pointer;
      border-radius: var(--r);
      transition: color .1s;
    }
    .mobile-nav-btn.active { color: var(--t1); }
    .mobile-nav-btn .nav-dot { font-size: 20px; line-height: 1; }

    /* ── Mobile hamburger ──────────────────────────────────── */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(52px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background: var(--bg1);
      border-bottom: 1px solid var(--b1);
      z-index: 150;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
    }
    .mobile-header-title {
      font-size: var(--text-md);
      font-weight: 600;
    }
    .mobile-drawer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
    }
    .mobile-drawer-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.4);
    }
    .mobile-drawer-panel {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 260px;
      background: var(--bg1);
      padding: 20px 12px;
      overflow-y: auto;
    }
    .mobile-drawer.open { display: block; }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Estructura */
      .sidebar { display: none; }
      .mobile-header { display: flex; }
      .mobile-nav { display: block; }
      .main-content {
        margin-left: 0;
        max-width: 100vw;
        width: 100vw;
        overflow-x: hidden;
        padding-top: calc(64px + env(safe-area-inset-top));
        padding-left: 14px;
        padding-right: 14px;
        padding-bottom: calc(76px + env(safe-area-inset-bottom));
      }
      /* Red de seguridad: la PÁGINA no se desborda, pero el contenido interno de las tarjetas sí puede hacer scroll-x */
      html, body { overflow-x: hidden; max-width: 100vw; }
      .card { max-width: 100%; padding: 16px 16px; }
      /* Fase 3I -- el ancho máximo de lectura del desktop no debe
         restringir nada en móvil (el padding del contenedor ya manda). */
      .main-content > * { max-width: 100%; }
      .page-title { font-size: var(--text-xl); }
      .tbl-scroll { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
      /* KPIs en tira deslizable */
      .kpi-strip { display: flex !important; overflow-x: auto; gap: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .kpi-strip::-webkit-scrollbar { display: none; }
      .kpi-strip > * { flex: 0 0 auto; min-width: 120px; }

      /* Grids: métricas en 2 columnas, el resto en 1 */
      .grid-5, .grid-4 { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
      .grid-3, .grid-2 { grid-template-columns: 1fr !important; gap: 12px !important; }

      /* Tipografía y títulos */
      .page-title { font-size: 18px; }
      .hide-mobile { display: none !important; }

      /* Cards y métricas compactas */
      /* Fase 3I-2b -- más aire interior y, sobre todo, separación REAL
         entre cards consecutivas (antes se pegaban entre sí). */
      .card   { padding: 16px 15px !important; border-radius: var(--rl) !important; }
      .card + .card { margin-top: 12px; }
      .metric { padding: 14px !important; border-radius: var(--rl) !important; }

      /* Fase 3I-2b -- altura táctil mínima cómoda (~40px) en botones e
         inputs. Antes los botones pequeños inline (fontSize 11, padding
         3px) quedaban imposibles de tocar con precisión. */
      button { padding: 10px 14px; min-height: 40px; }
      button.tab { padding: 9px 12px; font-size: 12px; min-height: 40px; }
      /* Botones pequeños dentro de filas de acciones: no bajar de 36px. */
      td button, .oc-card button, .acciones-row button { min-height: 36px; }

      /* Tabs */
      .tab-scroll::-webkit-scrollbar { display: none; }
      button.tab { padding: 8px 11px; font-size: 12px; }

      /* Botón nuevo del dashboard oculto (ya hay + en el header) */
      .dash-new-btn { display: none !important; }

      /* Tablas compactas con scroll horizontal controlado */
      /* Fase 3I-2b -- el scroll-x se mantiene (necesario para tablas
         densas), pero con padding real y sin que el encabezado se
         comprima. Las tablas que SÍ tienen alternativa de tarjetas
         (Operación/OC) usan .hide-mobile/.show-mobile y ni siquiera
         llegan aquí. */
      table { font-size: 12px !important; }
      table td, table th { padding: 9px 8px !important; white-space: nowrap; }
      table th { font-size: 10px !important; }
      .tbl-scroll { -webkit-overflow-scrolling: touch; }

      /* Alertas en columna */
      .alert-row { flex-direction: column !important; align-items: flex-start !important; gap: 4px !important; }
      .alert-badge { align-self: flex-start !important; }

      /* Grids inline sin clase — forzar 1 columna en mobile */
      .mob-1col  { grid-template-columns: 1fr !important; }
      .mob-2col  { grid-template-columns: repeat(2, 1fr) !important; }
      .show-mobile { display: flex !important; flex-direction: column; }

      /* Filtros apilados verticalmente para que quepan completos */
      .filtros-bar { flex-direction: column !important; }
      .filtros-bar > * { width: 100% !important; max-width: 100% !important; box-sizing: border-box; }
      .filtros-bar select, .filtros-bar input { width: 100% !important; max-width: 100% !important; box-sizing: border-box; }
      .filtros-bar .filtro-spacer { display: none !important; }
      .filtros-bar .view-toggle { display: flex; gap: 8px; }
      .filtros-bar .view-toggle button { flex: 1; }

      /* Inputs más cómodos al tocar. font-size 16px evita el zoom
         automático de iOS al enfocar un campo. */
      input, select, textarea { padding: 11px 12px; font-size: 16px; min-height: 44px; }
      textarea { min-height: 88px; }

      /* Fase 3I-2b -- utilidades móviles reutilizables. */
      /* Fila de acciones: los botones se reparten y bajan de línea con
         aire, en vez de amontonarse pegados. */
      .acciones-row { display: flex !important; flex-wrap: wrap; gap: 8px !important; }
      .acciones-row > button { flex: 1 1 auto; min-width: 44%; margin-left: 0 !important; }
      /* Stack: cualquier fila que en móvil debe apilarse. */
      .mob-stack { flex-direction: column !important; align-items: stretch !important; gap: 10px !important; }
      /* Tarjeta de OC en móvil (Operación). */
      .oc-card {
        border: 1px solid var(--b1);
        border-radius: var(--rl);
        padding: 14px;
        margin-bottom: 10px;
        background: var(--bg1);
      }
      /* Fase 3I-2b -- modal de OC: aprovecha casi toda la pantalla en
         móvil (antes quedaba con padding de escritorio, desperdiciando
         ancho útil en un modal que ya es denso). */
      .oc-modal { padding: 16px 14px !important; max-height: 94vh !important; border-radius: var(--rl) !important; }
      /* Las pestañas Vehículos/Equipo/Servicios del modal necesitan poder
         achicarse sin desbordar. */
      .oc-modal button { font-size: 12px; }
    }

    /* ── Fase 3I-2b -- escalón intermedio (tablet / móvil grande) ─────── */
    @media (max-width: 900px) and (min-width: 769px) {
      .main-content { padding: 24px 20px 40px; }
      /* En tablet, 5 y 4 columnas son demasiado apretadas. */
      .grid-5 { grid-template-columns: repeat(3, 1fr) !important; }
      .grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
    }

    /* ── Fase 3I-2b -- pantallas chicas (iPhone SE / mini) ───────────── */
    @media (max-width: 520px) {
      .main-content { padding-left: 12px; padding-right: 12px; }
      .card { padding: 14px 13px !important; }
      .tbl-scroll { margin-left: -13px; margin-right: -13px; padding-left: 13px; padding-right: 13px; }
      /* Las métricas dejan de ir en 2 columnas: en pantallas de ~360px
         de ancho, 2 columnas dejan los números ilegibles. */
      .grid-5, .grid-4 { grid-template-columns: 1fr !important; }
      .page-title { font-size: 17px; }
      /* Acciones a ancho completo -- más fáciles de tocar. */
      .acciones-row > button { min-width: 100%; }
    }
  
  summary::-webkit-details-marker { display:none; }
  summary::marker { content:""; }
  details summary { list-style:none; }
</style>
</head>
